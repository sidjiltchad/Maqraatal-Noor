<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نظام تصميم مقرأة النور</title><style>body{margin:0;padding:32px;background:#F7F2E9;color:#2B1B20;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto}h1,h2{color:#6E1B34}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.swatch{padding:18px;background:#FFFDF9;border:1px solid #EADBC8;border-radius:16px}.color{height:54px;border-radius:10px;margin-bottom:10px}.cta{background:#C9A227;color:#6E1B34;padding:12px 20px;border-radius:14px;border:0;font-size:16px}.brand{background:#6E1B34;color:white;padding:14px;border-radius:14px}</style><main><h1>مقرأة النور</h1><p>عنابي هادئ، كريمي دافئ، وذهبي للتحديد. RTL افتراضي؛ التحقق الحقيقي يتم على Android.</p><section class="grid"><div class="swatch"><div class="color" style="background:#6E1B34"></div>أساسي #6E1B34</div><div class="swatch"><div class="color" style="background:#C9A227"></div>ذهبي #C9A227</div><div class="swatch"><div class="color" style="background:#F7F2E9"></div>خلفية #F7F2E9</div><div class="swatch"><div class="color" style="background:#FFFDF9;border:1px solid #EADBC8"></div>سطح #FFFDF9</div></section><h2>أمثلة الحالة</h2><p class="brand">عنوان القسم — لون أساسي ونص عالي التباين</p><button class="cta">إجراء رئيسي</button></main></html>
